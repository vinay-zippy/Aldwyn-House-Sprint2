name: Promote Dev to QA

on:
  push:
    branches: ["develop"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: meridian
          POSTGRES_PASSWORD: meridian
          POSTGRES_DB: meridian_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U meridian -d meridian_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync

      - name: Run backend tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg2://meridian:meridian@localhost:5432/meridian_test
          TEST_DATABASE_URL: postgresql+psycopg2://meridian:meridian@localhost:5432/meridian_test
          MONGODB_URL: mongodb://localhost:27017
        run: uv run pytest -q

      - name: Run backend lint
        working-directory: backend
        run: uv run ruff check .

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript check
        working-directory: frontend
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Validate Docker Compose
        run: docker compose config

      - name: Build Docker images
        run: docker compose build

  deploy-dev:
    name: Deploy to Dev
    needs: build-and-test
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Dev
        run: |
          echo "Deploying Aldwyn House to Dev environment..."
          echo "Dev deployment command will be configured here."

  deploy-qa:
    name: Deploy to QA
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: qa

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to QA
        run: |
          echo "Deploying Aldwyn House to QA environment..."
          echo "QA deployment command will be configured here."
